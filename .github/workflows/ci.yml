name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savr/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: savr/backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Run Test Suite
        env:
          JWT_SECRET: ci_jwt_test_secret_32_characters_minimum
          DATABASE_PATH: ./data/test.db
        run: npm test

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: savr/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: savr/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build
