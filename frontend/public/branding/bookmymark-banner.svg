<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>

    <!-- Subtle Radial Glow Behind Logo -->
    <radialGradient id="glow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B0F17" stop-opacity="0"/>
    </radialGradient>

    <!-- Badge Pills Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Drop Shadow for Emblem -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #FFFFFF; letter-spacing: -0.025em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #94A3B8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11.5px; fill: #38BDF8; letter-spacing: 0.02em; }
    .tag-green { fill: #34D399; }
    .tag-purple { fill: #A78BFA; }
    .tag-orange { fill: #FB923C; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="216" rx="20" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="2" y="2" width="876" height="216" rx="20" fill="url(#glow)"/>

  <!-- Left: Emblem Container -->
  <g transform="translate(48, 46)" filter="url(#shadow)">
    <!-- White Card -->
    <rect x="0" y="0" width="102" height="128" rx="16" fill="#FFFFFF"/>
    
    <!-- Bookmark Ribbon -->
    <path d="M28 0 H74 V70 L51 53 L28 70 V0Z" fill="#0F172A"/>
    
    <!-- Content Progress / Text Indicator Bars -->
    <rect x="26" y="86" width="50" height="7.5" rx="3.75" fill="#0F172A"/>
    <rect x="26" y="102" width="32" height="7.5" rx="3.75" fill="#0F172A"/>
  </g>

  <!-- Right: Branding Text & Meta -->
  <g transform="translate(184, 52)">
    <!-- Main Title -->
    <text x="0" y="34" class="title">BookMyMark</text>
    
    <!-- Subtitle -->
    <text x="0" y="66" class="subtitle">Smart Visual Bookmark Library &amp; AI Knowledge Vault</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(0, 88)">
      <!-- Pill 1: Android Share -->
      <g transform="translate(0, 0)">
        <rect width="144" height="28" rx="14" fill="url(#pillGrad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="12" y="18" class="tag">📲 1-Tap Native Share</text>
      </g>

      <!-- Pill 2: 0-Byte Storage -->
      <g transform="translate(152, 0)">
        <rect width="148" height="28" rx="14" fill="url(#pillGrad)" stroke="#34D399" stroke-width="1" stroke-opacity="0.4"/>
        <text x="12" y="18" class="tag tag-green">⚡ Zero-Blob Previews</text>
      </g>

      <!-- Pill 3: Groq AI -->
      <g transform="translate(308, 0)">
        <rect width="138" height="28" rx="14" fill="url(#pillGrad)" stroke="#FB923C" stroke-width="1" stroke-opacity="0.4"/>
        <text x="12" y="18" class="tag tag-orange">🤖 Groq AI Classifier</text>
      </g>

      <!-- Pill 4: Supabase Realtime -->
      <g transform="translate(454, 0)">
        <rect width="144" height="28" rx="14" fill="url(#pillGrad)" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.4"/>
        <text x="12" y="18" class="tag tag-purple">🔄 Supabase Realtime</text>
      </g>
    </g>
  </g>
</svg>
